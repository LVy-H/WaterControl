[platformio]
default_envs = esp32-offline
src_dir = firmware/WaterDistribution
include_dir = firmware/WaterDistribution/src

[env]
platform = espressif32@6.9.0
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.0
    espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*>
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@1.1.4

[env:esp32-offline]
build_flags = ${env.build_flags} -DWATER_ENABLE_CLOUD=0

[env:esp32-cloud]
build_flags = ${env.build_flags} -DWATER_ENABLE_CLOUD=1
extra_scripts = pre:firmware/cloud_config.py
lib_deps =
    ${env.lib_deps}
    blynkkk/Blynk@1.3.2
